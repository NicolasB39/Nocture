name: pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Images PNG téléversées dans scenarios/ : converties en WebP et enregistrées dans le dépôt avant les tests et la
  # publication. Seule étape qui peut écrire dans le dépôt, et sans npm (tools/webp-ci.sh : cwebp d'Ubuntu). Son
  # commit ne relance pas de publication (GitHub ne déclenche rien sur un push fait par la publication elle-même).
  webp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: bash tools/webp-ci.sh
      - name: Enregistrer les WebP
        run: |
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'Images des scénarios converties en WebP'
          git push -q origin "HEAD:$GITHUB_REF_NAME"
  # Tests unitaires puis de bout en bout dans Chromium, sur les fichiers tels qu'ils seront publiés.
  # Job à part : node_modules et le navigateur ne partent pas dans l'artefact du site.
  # Les deux étapes suivantes partent de la branche telle qu'après webp (ref), WebP compris.
  test:
    needs: webp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run scenarios
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-echec
          path: e2e-echec.png
          if-no-files-found: ignore
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url || steps.d2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm run build
      - run: git -c core.quotepath=off ls-files scenarios | jq -R . | jq -s . > index.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      # Le paquet du site vient d'être envoyé, mais il arrive que deploy-pages ne le trouve pas encore (« Found 0
      # artifact(s) ») : on attend un peu et on réessaie une fois, dans la même exécution. Relancer l'étape depuis
      # GitHub enverrait un second paquet du même nom, que deploy-pages refuse.
      - id: d
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.d.outcome == 'failure'
        run: sleep 30
      - id: d2
        if: steps.d.outcome == 'failure'
        uses: actions/deploy-pages@v5
